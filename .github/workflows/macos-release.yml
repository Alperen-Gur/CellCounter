name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; must match MARKETING_VERSION (for example 1.2.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish macOS ${{ inputs.version }}
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version, notes and tag
        run: |
          grep -q "MARKETING_VERSION = ${VERSION};" CellCounting.xcodeproj/project.pbxproj \
            || { echo "::error::MARKETING_VERSION is not ${VERSION}"; exit 1; }
          test -f "docs/releases/${TAG}.md" \
            || { echo "::error::docs/releases/${TAG}.md is missing"; exit 1; }
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::error::Release ${TAG} already exists"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Prepare pinned native microscopy worker
        run: |
          npm ci --prefix desktop --ignore-scripts
          node shared/microscopy-worker/build.mjs --output "$RUNNER_TEMP/microscopy-assets"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess, urllib.request
          pins = json.loads(pathlib.Path('shared/microscopy-worker/node-runtime.json').read_text())
          for platform in ('darwin-arm64',):
              artifact = pins['artifacts'][platform]
              archive = pathlib.Path(os.environ['RUNNER_TEMP']) / artifact['file']
              urllib.request.urlretrieve('https://nodejs.org/download/release/v' + pins['version'] + '/' + artifact['file'], archive)
              subprocess.run(['python3', 'shared/microscopy-worker/stage-runtime.py', '--platform', platform,
                  '--archive', str(archive), '--assets', os.environ['RUNNER_TEMP'] + '/microscopy-assets',
                  '--output', 'shared/microscopy-worker/dist/' + platform], check=True)
          PYCODE

      - name: Build Apple silicon app
        run: |
          xcodebuild build \
            -project CellCounting.xcodeproj \
            -scheme CellCounting \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/build" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=""

      - name: Verify app bundle
        run: |
          APP="$RUNNER_TEMP/build/Build/Products/Release/CellCounting.app"
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          test "$BUNDLE_VERSION" = "$VERSION" \
            || { echo "::error::Bundle version $BUNDLE_VERSION does not match $VERSION"; exit 1; }
          ARCHITECTURES=$(lipo -archs "$APP/Contents/MacOS/CellCounting")
          test "$ARCHITECTURES" = "arm64" \
            || { echo "::error::Expected an arm64-only binary, found: $ARCHITECTURES"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/build/Build/Products/Release/CellCounting.app" \
            "$RUNNER_TEMP/dist/CellCounter-${TAG}.zip"
          cd "$RUNNER_TEMP/dist"
          shasum -a 256 "CellCounter-${TAG}.zip" > "CellCounter-${TAG}.zip.sha256"
          cp "CellCounter-${TAG}.zip.sha256" SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "CellCounter ${TAG} for macOS" \
            --notes-file "docs/releases/${TAG}.md" \
            --latest \
            "$RUNNER_TEMP/dist/CellCounter-${TAG}.zip" \
            "$RUNNER_TEMP/dist/CellCounter-${TAG}.zip.sha256" \
            "$RUNNER_TEMP/dist/SHA256SUMS.txt"
