name: Scheduled diagnostics releases

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: Validate staged packages without pushing or publishing
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: scheduled-diagnostics-releases
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish prepared releases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out scheduler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Verify packages and honor the publication window
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLAN: ${{ vars.DIAGNOSTICS_RELEASE_PLAN }}
          CHECK_ONLY: ${{ inputs.check_only || false }}
        run: python3 .github/scripts/publish-scheduled.py
