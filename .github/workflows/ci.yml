name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "shared/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "CellCounting/**"
      - "CellCountingTests/**"
      - "CellCounting.xcodeproj/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "shared/**"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "CellCounting/**"
      - "CellCountingTests/**"
      - "CellCounting.xcodeproj/**"

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Native macOS (Swift) app. Compiles the Xcode
  # project with signing disabled (no developer team in CI).
  swift-build:
    name: swift-build (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Prepare pinned native microscopy worker
        run: |
          npm ci --prefix desktop --ignore-scripts
          node shared/microscopy-worker/build.mjs --output "$RUNNER_TEMP/microscopy-assets"
          python3 - <<'PYCODE'
          import json, os, pathlib, subprocess, urllib.request
          pins = json.loads(pathlib.Path('shared/microscopy-worker/node-runtime.json').read_text())
          for platform in ('darwin-arm64',):
              artifact = pins['artifacts'][platform]
              archive = pathlib.Path(os.environ['RUNNER_TEMP']) / artifact['file']
              urllib.request.urlretrieve('https://nodejs.org/download/release/v' + pins['version'] + '/' + artifact['file'], archive)
              subprocess.run(['python3', 'shared/microscopy-worker/stage-runtime.py', '--platform', platform,
                  '--archive', str(archive), '--assets', os.environ['RUNNER_TEMP'] + '/microscopy-assets',
                  '--output', 'shared/microscopy-worker/dist/' + platform], check=True)
          PYCODE

      - name: Test native macOS app
        run: |
          export TEST_RUNNER_CELLCOUNTER_DATA_ROOT="$(mktemp -d)"
          xcodebuild test \
            -project CellCounting.xcodeproj \
            -scheme CellCounting \
            -destination 'platform=macOS' \
            -only-testing:CellCountingTests \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/CellCounterTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Preserve native test failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-macos-test-results
          path: ${{ runner.temp }}/CellCounterTests.xcresult
          retention-days: 7
          if-no-files-found: warn

      - name: Verify training and assay workers
        env:
          # Source checkout keeps canonical kernels separate; shipped apps stage
          # these files beside their legacy compatibility wrappers.
          PYTHONPATH: ${{ github.workspace }}/shared/python
        run: |
          python3 -m venv /tmp/cellcounter-test-env
          /tmp/cellcounter-test-env/bin/pip install numpy scipy scikit-image tifffile pillow
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_training_dataset.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_assay_worker.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_detection_startup.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_model_downloads.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_cell_measurement.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_serve_modes.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_sam_serving.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_resource_limits.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s shared/python/tests -p test_workbench_resource_limits.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_cellpose_accel.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s CellCounting/python/tests -p test_cellpose_runtime.py
          /tmp/cellcounter-test-env/bin/python -m unittest discover -s shared/python/tests -p test_workbench_cellpose_input.py
