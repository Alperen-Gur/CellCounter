name: Windows native installers

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "docs/WINDOWS.md"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    name: Verify and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NODE_VERSION: "22.18.0"
      RUST_TOOLCHAIN: "1.88.0"
      UV_VERSION: "0.11.29"
      UV_SHA256: "a047d55651bc3e0ca24595b25ec4cfcb10f9dca9fb56514e661269b37d4fae68"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install pinned Rust
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --no-self-update
          rustup default $env:RUST_TOOLCHAIN
          rustc --version

      - name: Install locked frontend dependencies
        working-directory: desktop
        run: npm ci

      - name: Download and verify bundled uv sidecar
        shell: pwsh
        working-directory: desktop
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "uv-x86_64-pc-windows-msvc.zip"
          $expanded = Join-Path $env:RUNNER_TEMP "uv-sidecar"
          $uri = "https://github.com/astral-sh/uv/releases/download/$env:UV_VERSION/uv-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $uri -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:UV_SHA256) {
            throw "uv checksum mismatch: expected $env:UV_SHA256, received $actual"
          }
          Expand-Archive -Path $archive -DestinationPath $expanded -Force
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Move-Item -Force -Path (Join-Path $expanded "uv.exe") -Destination "src-tauri/binaries/uv-x86_64-pc-windows-msvc.exe"

      - name: Verify Windows release contract
        working-directory: desktop
        run: npm run verify:windows

      - name: Build and type-check frontend
        working-directory: desktop
        run: npm run build

      - name: Test Rust backend
        working-directory: desktop
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build MSI and NSIS installers
        working-directory: desktop
        run: npm run build:windows

      - name: Assert both native installer artifacts
        working-directory: desktop
        run: node scripts/verify-windows-artifacts.mjs --write-checksums

      - name: Upload unsigned Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CellCounter-Windows-1.0.8-x64-unsigned
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/SHA256SUMS.txt
