name: Web private PWA

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/WEB.md"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/WEB.md"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-private-pwa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify private WebGPU PWA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        working-directory: web
        run: npm ci

      - name: Build production PWA
        working-directory: web
        run: npm run build

      - name: Run browser-domain tests
        working-directory: web
        run: npm test -- --run

      - name: Verify local-only privacy boundary
        working-directory: web
        run: npm run verify:privacy

      - name: Verify workflow contract
        working-directory: web
        run: npm run verify:workflow

      - name: Verify exact model catalog
        working-directory: web
        run: npm run verify:models

      - name: Verify core inference and persistence seams
        working-directory: web
        run: npm run verify:core

      - name: Verify complete macOS capability inventory
        working-directory: web
        run: npm run verify:parity

      - name: Verify browser-native analysis and exports
        working-directory: web
        run: npm run verify:parity-analysis
